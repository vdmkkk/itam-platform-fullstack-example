[project]
name = "itam-board-backend"
version = "1.0.0"
description = "Example backend for the frontend-itam course: a Trello-like board of events, ideas and questions."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "email-validator>=2.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
