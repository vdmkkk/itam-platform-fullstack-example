# Edge proxy block for the frontend-itam example backend.
#
# Paste inside the `listen 443 ssl; server_name courses.salut.uno;` server block
# of /root/courses-edge-nginx.conf, then validate and reload without dropping traffic:
#
#   docker exec courses_edge_proxy nginx -t && docker exec courses_edge_proxy nginx -s reload
#
# The trailing slash on proxy_pass is load-bearing: it strips
# /example-backend/frontend-itam before the request reaches the app, which is why
# the app sets ROOT_PATH to the same prefix for its docs to work.

location /example-backend/frontend-itam/ {
    proxy_pass http://127.0.0.1:19100/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /example-backend/frontend-itam;

    # The API answers CORS itself (students call it from any origin).
    proxy_read_timeout 60s;
    client_max_body_size 10m;
}

# Redirect the bare slug to the trailing-slash form so relative URLs resolve.
location = /example-backend/frontend-itam {
    return 301 /example-backend/frontend-itam/;
}
