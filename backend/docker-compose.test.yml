# Runs the test suite against a throwaway, in-memory Postgres. It never touches
# the real stack's database:
#
#   docker compose -f docker-compose.test.yml run --rm --build tests
#   docker compose -f docker-compose.test.yml down

name: example_backend_tests

services:
  test-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: board_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d board_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@test-postgres:5432/board_test
    command: ["pytest", "-q"]
    depends_on:
      test-postgres:
        condition: service_healthy
